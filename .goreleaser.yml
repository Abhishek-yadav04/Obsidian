---
project_name: obsidian-waf
before:
  hooks:
    - go mod tidy
    - go generate ./...
builds:
  - id: obsidian
    main: ./cmd/obsidian
    binary: obsidian
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.AppVersion={{.Version}}
      - -X main.GitCommit={{.Commit}}
      - -X main.BuildDate={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'
archives:
  - id: default
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - coraza.conf-recommended
      - default.conf
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256
snapshot:
  name_template: '{{ incpatch .Version }}-next'
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: '🔒 Security'
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: '📦 Dependencies'
      regexp: '^.*?deps(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999
release:
  github:
    owner: '{{ .Env.GITHUB_REPOSITORY_OWNER }}'
    name: obsidian-waf
  draft: false
  prerelease: auto
  mode: append
  header: |
  ## Obsidian Sentinel WAF {{ .Version }}
    Enterprise-grade Web Application Firewall powered by Coraza WAF engine.
  footer: |
    ---
    **Full Changelog**: https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}
    **Docker Image**: `ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}`
dockers:
  - image_templates:
      - 'ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:{{ .Version }}'
      - 'ghcr.io/{{ .Env.GITHUB_REPOSITORY }}:latest'
    dockerfile: Dockerfile
    build_flag_templates:
      - '--label=org.opencontainers.image.title={{ .ProjectName }}'
      - '--label=org.opencontainers.image.version={{ .Version }}'
      - '--label=org.opencontainers.image.created={{ .Date }}'
      - '--label=org.opencontainers.image.revision={{ .FullCommit }}'
      - '--build-arg=VERSION={{ .Version }}'
      - '--build-arg=COMMIT={{ .Commit }}'
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-certificate=${certificate}'
      - '--output-signature=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true
