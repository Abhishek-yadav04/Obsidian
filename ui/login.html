<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obsidian Sentinel - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1a1d21;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background-color: #2c3036;
      border: 1px solid #3d424a;
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      color: #fff;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .brand {
      color: #dc3545;
      font-weight: bold;
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-control {
      background-color: #1a1d21;
      border-color: #3d424a;
      color: #fff;
    }
    .form-control:focus {
      background-color: #1a1d21;
      border-color: #dc3545;
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
    }
    .btn-primary {
      background-color: #dc3545;
      border-color: #dc3545;
      width: 100%;
      padding: 0.75rem;
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #bb2d3b;
      border-color: #b02a37;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">Obsidian Sentinel</div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" value="admin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" value="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
      <div class="mt-3 text-center text-danger" id="errorMsg" style="display:none"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('obsidian_token', data.token);
          window.location.href = '/';
        } else {
          document.getElementById('errorMsg').innerText = 'Invalid credentials';
          document.getElementById('errorMsg').style.display = 'block';
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
