---
apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-waf
  labels:
    app.kubernetes.io/name: obsidian-waf
    app.kubernetes.io/part-of: obsidian
    # Pod Security Standards - enforce restricted profile
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-config
  namespace: obsidian-waf
data:
  OBSIDIAN_PORT: "8082"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
---
# IMPORTANT: Do NOT commit secrets to version control!
# Create secrets manually or use a secrets management solution:
# 
# Option 1: Manual creation (for local/dev):
#   kubectl create secret generic obsidian-secrets \
#     --namespace=obsidian-waf \
#     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=DATABASE_URL="postgresql://user:password@postgres:5432/obsidian?sslmode=require" \
#     --from-literal=REDIS_URL="redis://:password@redis:6379"
# 
# Option 2: Use External Secrets Operator with a vault (recommended for production):
#   - Install External Secrets Operator
#   - Configure SecretStore to connect to your vault (AWS Secrets Manager, HashiCorp Vault, etc.)
#   - Create ExternalSecret referencing vault keys
# 
# Option 3: Use Sealed Secrets for GitOps:
#   - Install kubeseal
#   - kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#   - Commit sealed-secret.yaml (encrypted)
# 
# Option 4: Use Kustomize secretGenerator with .env file (add .env to .gitignore):
#   secretGenerator:
#     - name: obsidian-secrets
#       envs:
#         - .env.secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
  labels:
    app.kubernetes.io/name: obsidian-waf
    app.kubernetes.io/version: "2.2.4"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: obsidian-waf
  template:
    metadata:
      labels:
        app: obsidian-waf
        app.kubernetes.io/name: obsidian-waf
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      priorityClassName: obsidian-waf-critical
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: obsidian-waf
      containers:
        - name: obsidian
          image: ghcr.io/corazawaf/obsidian-waf:2.2.4
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: obsidian-config
            - secretRef:
                name: obsidian-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "500Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - obsidian-waf
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
  labels:
    app.kubernetes.io/name: obsidian-waf
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: obsidian-waf
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - waf.example.com  # REPLACE with your domain
      secretName: obsidian-tls
  rules:
    - host: waf.example.com  # REPLACE with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obsidian-waf
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: obsidian-waf
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: obsidian-waf
---
# NetworkPolicy: restrict ingress to only the Ingress controller and inter-pod traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-waf-netpol
  namespace: obsidian-waf
spec:
  podSelector:
    matchLabels:
      app: obsidian-waf
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: obsidian-waf
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connections to PostgreSQL and Redis (in-namespace)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # Allow HTTPS outbound (threat feeds, GeoIP updates)
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: obsidian-waf
  namespace: obsidian-waf
  labels:
    app.kubernetes.io/name: obsidian-waf
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obsidian-waf
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# PriorityClass for WAF pods (security-critical workload)
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: obsidian-waf-critical
value: 1000000
globalDefault: false
description: "Priority class for Obsidian WAF pods - security-critical workload"
