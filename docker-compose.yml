version: '3.8'

services:
  obsidian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-waf
    ports:
      - "${OBSIDIAN_PORT:-8082}:8082"
    environment:
      - OBSIDIAN_PORT=8082
      - OBSIDIAN_LOG_LEVEL=${LOG_LEVEL:-info}
      - OBSIDIAN_LOG_FORMAT=${LOG_FORMAT:-json}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-obsidian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-obsidian}?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-}@redis:6379}
      - OBSIDIAN_JWT_SECRET=${OBSIDIAN_JWT_SECRET:?OBSIDIAN_JWT_SECRET is required}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - obsidian-network
    volumes:
      - obsidian-data:/app/data
      - obsidian-logs:/app/logs

  postgres:
    image: postgres:16-alpine
    container_name: obsidian-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-obsidian}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-obsidian}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obsidian} -d ${POSTGRES_DB:-obsidian}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - obsidian-network

  redis:
    image: redis:7-alpine
    container_name: obsidian-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - obsidian-network

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: obsidian-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - obsidian
    restart: unless-stopped
    networks:
      - obsidian-network
    profiles:
      - production

networks:
  obsidian-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  obsidian-data:
  obsidian-logs:
