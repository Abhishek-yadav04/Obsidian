name: Fuzz Tests

on:
  schedule:
    - cron: "05 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: Go Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run fuzz tests
        run: go run mage.go fuzz

      - name: Create GitHub issue on failure
        if: failure() && github.run_attempt == 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[fuzz] Failure in $GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER" \
            --body "The scheduled fuzz test failed. Run details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} Please investigate potential crashers or newly discovered failing inputs." \
            --label "bug" \
            --label "security"
