<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian Sentinel - Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --obsidian-dark: #1a1a2e;
    --obsidian-darker: #16213e;
    --obsidian-purple: #7c3aed;
}
body { 
    background: linear-gradient(135deg, var(--obsidian-dark) 0%, var(--obsidian-darker) 100%);
    min-height: 100vh;
}
.glass-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.oauth-btn { transition: all 0.2s ease; }
.oauth-btn:hover { transform: translateY(-2px); }
</style>
</head>
<body class="flex items-center justify-center text-gray-200">

<div class="w-full max-w-md p-8">
    <!-- Logo -->
    <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-purple-600 to-blue-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
            <i class="fas fa-shield-halved text-white text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-white">Obsidian Sentinel</h1>
        <p class="text-gray-400 mt-2">Enterprise WAF Security Platform</p>
    </div>

    <div class="glass-card rounded-2xl p-8 shadow-2xl">
        <!-- Login Form -->
        <div id="loginForm">
            <h2 class="text-xl font-semibold text-white mb-6 text-center">Sign In</h2>
            
            <!-- OAuth Buttons -->
            <div class="space-y-3 mb-6">
                <button onclick="oauthLogin('google')" class="oauth-btn w-full flex items-center justify-center space-x-3 bg-white text-gray-800 py-3 px-4 rounded-lg font-medium hover:bg-gray-100">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
                
                <button onclick="oauthLogin('github')" class="oauth-btn w-full flex items-center justify-center space-x-3 bg-gray-800 text-white py-3 px-4 rounded-lg font-medium hover:bg-gray-700 border border-gray-600">
                    <i class="fab fa-github text-xl"></i>
                    <span>Continue with GitHub</span>
                </button>
            </div>

            <div class="flex items-center my-6">
                <div class="flex-1 border-t border-gray-600"></div>
                <span class="px-4 text-gray-400 text-sm">or sign in with email</span>
                <div class="flex-1 border-t border-gray-600"></div>
            </div>

            <!-- Email/Password Form -->
            <form onsubmit="login(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Username or Email</label>
                        <div class="relative">
                            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" id="username" required
                                class="w-full bg-gray-800 border border-gray-600 rounded-lg py-3 px-10 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500"
                                placeholder="Enter username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Password</label>
                        <div class="relative">
                            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="password" id="password" required
                                class="w-full bg-gray-800 border border-gray-600 rounded-lg py-3 px-10 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500"
                                placeholder="Enter password">
                            <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="errorMsg" class="hidden mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" id="loginBtn" class="w-full mt-6 bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600 text-white py-3 rounded-lg font-semibold transition shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                </button>
            </form>
        </div>

        <!-- MFA Form (initially hidden) -->
        <div id="mfaForm" class="hidden">
            <h2 class="text-xl font-semibold text-white mb-2 text-center">Two-Factor Authentication</h2>
            <p class="text-gray-400 text-sm text-center mb-6">Enter the 6-digit code from your authenticator app</p>
            
            <div class="flex justify-center space-x-2 mb-6">
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="0">
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="1">
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="2">
                <span class="flex items-center text-gray-500 text-2xl">-</span>
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="3">
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="4">
                <input type="text" maxlength="1" class="mfa-input w-12 h-14 bg-gray-800 border border-gray-600 rounded-lg text-center text-2xl text-white focus:outline-none focus:border-purple-500" data-index="5">
            </div>

            <div id="mfaError" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm text-center">
                <i class="fas fa-exclamation-circle mr-2"></i>
                <span>Invalid code. Please try again.</span>
            </div>

            <button onclick="verifyMFA()" class="w-full bg-gradient-to-r from-purple-600 to-blue-500 hover:from-purple-700 hover:to-blue-600 text-white py-3 rounded-lg font-semibold transition shadow-lg">
                <i class="fas fa-shield-check mr-2"></i>Verify
            </button>

            <button onclick="backToLogin()" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-white py-2 rounded-lg text-sm transition">
                <i class="fas fa-arrow-left mr-2"></i>Back to Login
            </button>
        </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-gray-500 text-sm mt-8">
        <i class="fas fa-shield-halved mr-1"></i>
        Obsidian Sentinel v2.2.0 Enterprise
    </p>
</div>

<script>
// Supabase Configuration (from environment)
const SUPABASE_URL = window.SUPABASE_URL || '';
const SUPABASE_KEY = window.SUPABASE_KEY || '';

let tempToken = null;

function togglePassword() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}

function showError(msg) {
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    errorText.textContent = msg;
    errorMsg.classList.remove('hidden');
}

function hideError() {
    document.getElementById('errorMsg').classList.add('hidden');
}

async function login(event) {
    event.preventDefault();
    hideError();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Signing in...';
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
            showError(data.error || 'Invalid credentials');
            return;
        }
        
        if (data.requires_mfa) {
            // Show MFA form
            tempToken = data.temp_token;
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('mfaForm').classList.remove('hidden');
            document.querySelectorAll('.mfa-input')[0].focus();
            return;
        }
        
        // No MFA, direct login
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify({ username: data.username, role: data.role }));
        window.location.href = 'index.html';
        
    } catch (err) {
        showError('Connection error. Please try again.');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Sign In';
    }
}

async function verifyMFA() {
    const inputs = document.querySelectorAll('.mfa-input');
    let code = '';
    inputs.forEach(i => code += i.value);
    
    if (code.length !== 6) {
        document.getElementById('mfaError').classList.remove('hidden');
        return;
    }
    
    try {
        const res = await fetch('/api/login/mfa', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ temp_token: tempToken, code })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
            document.getElementById('mfaError').classList.remove('hidden');
            inputs.forEach(i => i.value = '');
            inputs[0].focus();
            return;
        }
        
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify({ username: data.username, role: data.role }));
        window.location.href = 'index.html';
        
    } catch (err) {
        document.getElementById('mfaError').classList.remove('hidden');
    }
}

function backToLogin() {
    tempToken = null;
    document.getElementById('mfaForm').classList.add('hidden');
    document.getElementById('loginForm').classList.remove('hidden');
    document.querySelectorAll('.mfa-input').forEach(i => i.value = '');
}

// OAuth Login
async function oauthLogin(provider) {
    try {
        // Redirect to backend OAuth endpoint
        window.location.href = `/api/auth/${provider}`;
    } catch (err) {
        showError(`Failed to connect with ${provider}`);
    }
}

// MFA Input handling
document.querySelectorAll('.mfa-input').forEach((input, idx, inputs) => {
    input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val && idx < inputs.length - 1) {
            inputs[idx + 1].focus();
        }
        if (inputs.length && [...inputs].every(i => i.value)) {
            verifyMFA();
        }
    });
    
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
            inputs[idx - 1].focus();
        }
    });
    
    input.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text');
        const chars = paste.replace(/\D/g, '').slice(0, 6).split('');
        chars.forEach((char, i) => {
            if (inputs[i]) inputs[i].value = char;
        });
        if (chars.length === 6) verifyMFA();
    });
});

// Check if already logged in
if (localStorage.getItem('token')) {
    window.location.href = 'index.html';
}

// Handle OAuth callback
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('token')) {
    localStorage.setItem('token', urlParams.get('token'));
    const payload = JSON.parse(atob(urlParams.get('token').split('.')[1]));
    localStorage.setItem('user', JSON.stringify({ username: payload.username, role: payload.role }));
    window.location.href = 'index.html';
}
if (urlParams.get('error')) {
    showError(urlParams.get('error'));
}
</script>

</body>
</html>
