name: Render Architecture Diagrams

on:
  push:
    paths:
      - 'cmd/obsidian/docs/architecture.puml'
    branches: [ main, v2.0 ]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch full history for proper diff detection
        fetch-depth: 0

    - name: Setup PlantUML
      run: |
        sudo apt-get update
        sudo apt-get install -y plantuml

    - name: Render Diagrams
      run: |
        cd cmd/obsidian/docs
        echo "Rendering architecture diagram..."
        plantuml architecture.puml
        echo "SVG generated successfully"

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git diff --name-only cmd/obsidian/docs/architecture.svg)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Architecture diagram updated"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "No changes to architecture diagram"
        fi

    - name: Commit changes
      if: steps.verify-changed-files.outputs.changed == 'true'
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add cmd/obsidian/docs/architecture.svg
        git commit -m "docs: regenerate architecture diagram from PlantUML

Auto-generated by GitHub Actions
Source: cmd/obsidian/docs/architecture.puml"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}