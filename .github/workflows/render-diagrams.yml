name: Render Architecture Diagrams

on:
  push:
    branches: [main, v2]
    paths:
      - 'cmd/obsidian/docs/architecture.puml'

permissions:
  contents: write

jobs:
  render:
    name: Render PlantUML Architecture Diagram
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Use official PlantUML container (no apt-get, deterministic)
      - name: Render diagram
        uses: docker://plantuml/plantuml:latest
        with:
          args: >
            -tsvg
            cmd/obsidian/docs/architecture.puml

      - name: Detect changes
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd/obsidian/docs/architecture.svg; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated diagram
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/obsidian/docs/architecture.svg
          git commit -m "docs(architecture): regenerate diagram [auto]"
          git push
