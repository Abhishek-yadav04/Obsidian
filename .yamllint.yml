---
extends: default
rules:
  line-length:
    max: 120
    level: warning
  document-start:
    present: true
    level: error
  truthy:
    level: warning
    check-keys: false
    allowed-values: ['true', 'false']
  empty-lines:
    max: 2
    level: error
  commas:
    level: error
  comments:
    level: error
  new-line-at-end-of-file:
    level: error
