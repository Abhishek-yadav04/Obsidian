name: Regression Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

permissions: {}

jobs:
  generate-matrix:
    name: Generate Test Matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.generate.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go (matrix generation)
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
      - name: Generate tag combinations
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          go run mage.go tagsmatrix > tags.json
          echo "tags=$(cat tags.json)" >> "$GITHUB_OUTPUT"

  test:
    name: Regression Tests
    needs: generate-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.22.x, 1.23.x]
        build-flag: ${{ fromJson(needs.generate-matrix.outputs.tags) }}
    env:
      GOLANG_BASE_VERSION: "1.22.x"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Run tests and generate coverage
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_TAGS="${{ matrix.build-flag }}"
          go run mage.go coverage
      - name: Upload Codecov (General)
        if: matrix.go-version == env.GOLANG_BASE_VERSION
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.txt
          flags: default, ${{ matrix.build-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload Codecov (Examples)
        if: matrix.go-version == env.GOLANG_BASE_VERSION
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage-examples.txt
          flags: examples, ${{ matrix.build-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload Codecov (FTW)
        if: matrix.go-version == env.GOLANG_BASE_VERSION
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage-ftw.txt
          flags: ftw, ${{ matrix.build-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Upload Codecov (TinyGo)
        if: matrix.go-version == env.GOLANG_BASE_VERSION && hashFiles('build/coverage-tinygo.txt') != ''
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage-tinygo.txt
          flags: tinygo, ${{ matrix.build-flag }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  enforce-all-checks:
    name: Enforce All Checks
    runs-on: ubuntu-latest
    needs: test
    permissions:
      checks: read
    steps:
      - name: Wait for required status checks
        uses: poseidon/wait-for-status-checks@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          delay: 120s
          interval: 10s
          timeout: 3600s
          ignore: |
            codecov/patch
            codecov/project