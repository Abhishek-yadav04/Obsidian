---
name: Close inactive issues
on:
  schedule:
    - cron: "30 1 * * *"
permissions:
  issues: write
  pull-requests: write
jobs:
  close-issues:
    name: Handle stale issues
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629  # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: "stale"
          only-issue-labels: "awaiting feedback"
          stale-issue-message: >
            This issue has been inactive for 30 days while awaiting feedback.
            Please comment or remove the label to keep it open.
            Otherwise, it will be closed in 14 days.
          close-issue-message: >
            Closing this issue due to inactivity after being marked stale.
          days-before-pr-stale: -1
          days-before-pr-close: -1
