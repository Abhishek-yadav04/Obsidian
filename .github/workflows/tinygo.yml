---
name: TinyGo Tests
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
permissions:
  contents: read
jobs:
  test:
    name: TinyGo Compatibility Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.23.x]
  # Keep aligned with coraza-proxy-wasm
        tinygo-version: [0.34.0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: ${{ matrix.tinygo-version }}
      - name: Cache TinyGo build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/tinygo
          key: ${{ runner.os }}-tinygo-${{ matrix.tinygo-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-tinygo-${{ matrix.tinygo-version }}-
      - name: Run TinyGo tests (default)
        shell: bash
        run: |
          set -euo pipefail
          tinygo test ./...
      - name: Run TinyGo tests (memoize builders)
        shell: bash
        run: |
          set -euo pipefail
          tinygo test -tags=memoize_builders ./...
