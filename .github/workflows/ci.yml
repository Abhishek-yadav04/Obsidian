name: CI/CD Pipeline
on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.22.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Global permissions block removed to satisfy security requirements

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod download
      - run: go mod verify
      - name: Build
        run: |
          go build ./...
          cd cmd/obsidian && go build -o obsidian .
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read # Required for actions/checkout
      security-events: write # Required for github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Gosec
        uses: securego/gosec@v2.29.0
        with:
          args: '-fmt sarif -out gosec.sarif ./...'
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format json ./... > govuln.json
      - uses: actions/upload-artifact@v7
        with:
          name: govuln-report
          path: govuln.json

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Fixed the action path to include the owner
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build, security, lint]
    permissions:
      contents: read # Required for actions/checkout
      packages: write # Required to push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref, event=branch
            type=semver, pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read # Required for actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.24.2
        with:
          path: .
          format: cyclonedx-json

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: sbom
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Required by GoReleaser to publish GitHub Releases
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}