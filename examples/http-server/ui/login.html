<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coraza WAF Login</title>
<style>
body{display:flex;justify-content:center;align-items:center;height:100vh;background:#0f172a;color:#e5e7eb;font-family:"Segoe UI",Arial,sans-serif;}
.container{background:#020617;padding:30px;border-radius:10px;box-shadow:0 0 10px #000;width:300px;}
input{width:100%;padding:10px;margin:8px 0;border-radius:5px;border:none;}
button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:5px;background:#3b82f6;color:white;font-weight:bold;cursor:pointer;}
button:hover{background:#2563eb;}
h2{text-align:center;margin-bottom:20px;}
</style>
</head>
<body>
<div class="container">
  <h2>Admin Login</h2>
  <input type="text" id="u" placeholder="Username">
  <input type="password" id="p" placeholder="Password">
  <button onclick="login()">Login</button>
</div>
<script>
function login(){
  const user = document.getElementById('u').value;
  const pass = document.getElementById('p').value;
  if(user==="admin" && pass==="admin"){
    document.cookie="auth=admin;path=/";
    location.href="/ui/";
  }else{
    alert("Invalid credentials");
  }
}
</script>
</body>
</html>
