<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" stroke="#00f2ff" stroke-width="2" />
  <path d="M100 20 L40 140 H160 Z" fill="none" stroke="#00f2ff" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="90" r="15" fill="#00f2ff" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" duration="3s" repeatCount="indefinite" />
  </circle>
  <text x="50%" y="170" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">OBSIDIAN</text>
</svg>