---
name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly Sunday
permissions: {}

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -format sarif ./... > govuln.sarif || true
      - name: Upload govulncheck results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: govuln.sarif
  sast:
    name: Static Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run Gosec
        uses: securego/gosec@v2.23.0
        with:
          args: '-fmt sarif -out gosec.sarif ./...'
      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --fail
  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [sast]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Build container (no cache)
        run: docker build --no-cache -t obsidian-waf:scan .
      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.34.1
        with:
          image-ref: obsidian-waf:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL, HIGH
          exit-code: '0'
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: License check
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./... \
            --disallowed_types=restricted, reciprocal || true
